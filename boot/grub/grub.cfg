# Grim Boot: a GRUB-based ISO launcher (like Ventoy, but GRUB reads the ISO files itself).
# Put ISO files on the GRIMBOOT partition (anywhere at the top, or in /isos and its subfolders)
# and they show up here. Picking one finds out what kind of ISO it is and boots it the right way.
# https://github.com/lagswords-del/grim-os (boot/)

set grimboot_version=1.0.0

insmod part_msdos
insmod part_gpt
insmod fat
insmod exfat
insmod ext2
insmod ntfs
insmod iso9660
insmod udf
insmod loopback
insmod regexp
insmod test
insmod search
insmod probe
insmod linux
insmod bsd
insmod gzio
insmod xzio
insmod zstd
insmod chain
insmod all_video
insmod font
insmod png
insmod gfxterm
insmod echo
insmod sleep

# ---------------------------------------------------------------- where things are
set gbefi=$root
search --no-floppy --label --set=gbdata GRIMBOOT
if [ -z "$gbdata" ]; then
    echo "Grim Boot: can't find the GRIMBOOT partition with the ISO files."
    echo "Run 'grim-boot install' again, or check the USB."
    sleep 30
fi

# ---------------------------------------------------------------- look
if loadfont ($gbefi)/boot/grub/fonts/unicode.pf2; then
    set gfxmode=1024x768,1280x800,auto
    terminal_output gfxterm
    if background_image ($gbefi)/boot/grub/grimboot-bg.png; then true; fi
fi
set color_normal=light-gray/black
set color_highlight=white/red
set menu_color_normal=light-gray/black
set menu_color_highlight=white/red
set timeout_style=menu
set timeout=-1
if [ "${grub_platform}" == "efi" ]; then set gbplatform=UEFI; else set gbplatform=BIOS; fi

# ---------------------------------------------------------------- booting one ISO
# Each method checks the ISO's layout. $iso_path is the ISO's path on GRIMBOOT, like /isos/x.iso
function gb_msg {
    echo ""
    echo "  Grim Boot: $1"
    echo "  $iso_path"
    echo ""
}

function gb_fail {
    echo ""
    echo "  Grim Boot can't boot this ISO yet: $1"
    echo "  Press Esc to go back."
    sleep --interruptible 60
}

# Void Linux, Grim Void, and other dracut ISOs with /boot/vmlinuz + LiveOS (iso-scan finds the file)
function gb_dracut_void {
    gb_msg "Void / Grim Void (dracut live, found by iso-scan)"
    probe --set=gb_label --label (loop)
    linux (loop)/boot/vmlinuz root=live:CDLABEL=$gb_label iso-scan/filename=$iso_path init=/sbin/init ro \
        rd.luks=0 rd.md=0 rd.dm=0 loglevel=4 vconsole.unicode=1 vconsole.keymap=us locale.LANG=en_US.UTF-8 live.autologin $gb_extra
    initrd (loop)/boot/initrd
}

# Fedora and other dracut ISOs with images/pxeboot
function gb_dracut_fedora {
    gb_msg "Fedora-style live (dracut, iso-scan)"
    probe --set=gb_label --label (loop)
    linux (loop)/images/pxeboot/vmlinuz root=live:CDLABEL=$gb_label iso-scan/filename=$iso_path rd.live.image quiet $gb_extra
    initrd (loop)/images/pxeboot/initrd.img
}

# Ubuntu, Mint, Pop!_OS, Zorin... (casper)
function gb_casper {
    gb_msg "Ubuntu-style live (casper, iso-scan)"
    for k in (loop)/casper/vmlinuz*; do if [ -f "$k" ]; then set gb_k="$k"; break; fi; done
    for i in (loop)/casper/initrd*; do if [ -f "$i" ]; then set gb_i="$i"; break; fi; done
    linux $gb_k boot=casper iso-scan/filename=$iso_path quiet splash --- $gb_extra
    initrd $gb_i
}

# Debian live, Kali, MX... (live-boot, findiso)
function gb_debian_live {
    gb_msg "Debian-style live (live-boot, findiso)"
    for k in (loop)/live/vmlinuz*; do if [ -f "$k" ]; then set gb_k="$k"; break; fi; done
    for i in (loop)/live/initrd*; do if [ -f "$i" ]; then set gb_i="$i"; break; fi; done
    linux $gb_k boot=live components findiso=$iso_path quiet splash $gb_extra
    initrd $gb_i
}

# archiso without a loopback.cfg (img_dev + img_loop)
function gb_archiso {
    gb_msg "Arch-style live (archiso, img_loop)"
    probe --set=gb_uuid --fs-uuid $gbdata
    probe --set=gb_label --label (loop)
    for d in (loop)/*/boot/x86_64/vmlinuz-*; do
        if [ -f "$d" ]; then
            regexp --set=1:gb_base '^\(loop\)/([^/]+)/boot/x86_64/vmlinuz-(.+)$' "$d"
            regexp --set=1:gb_kname '/vmlinuz-([^/]+)$' "$d"
            break
        fi
    done
    linux $d archisobasedir=$gb_base img_dev=UUID=$gb_uuid img_loop=$iso_path archisolabel=$gb_label $gb_extra
    initrd (loop)/$gb_base/boot/x86_64/initramfs-$gb_kname.img
}

# GRUB's BSD loaders only work from BIOS; under UEFI the PC would just reset
function gb_bsd_ok {
    if [ "${grub_platform}" == "efi" ]; then
        gb_fail "$1 boots from Grim Boot in BIOS (legacy/CSM) mode only, for now. Turn on CSM/legacy boot in the firmware, or write this ISO to its own USB."
        return 1
    fi
    set gfxpayload=text
    terminal_output console
    return 0
}

# FreeBSD (and FreeBSD-based ISOs whose root is the CD itself): the whole ISO goes into RAM as md0
function gb_freebsd {
    if ! gb_bsd_ok FreeBSD; then return; fi
    gb_msg "FreeBSD (the ISO is loaded into RAM as a memory disk; this takes a moment)"
    kfreebsd (loop)/boot/kernel/kernel
    kfreebsd_loadenv (loop)/boot/device.hints
    kfreebsd_module ($gbdata)$iso_path type=mfs_root
    set kFreeBSD.vfs.root.mountfrom=cd9660:/dev/md0
    set kFreeBSD.vfs.root.mountfrom.options=ro
}

# OpenBSD: its install kernel (bsd.rd) carries its own ramdisk
function gb_openbsd {
    if ! gb_bsd_ok OpenBSD; then return; fi
    gb_msg "OpenBSD (install kernel bsd.rd)"
    for r in (loop)/*/amd64/bsd.rd (loop)/bsd.rd; do if [ -f "$r" ]; then set gb_rd="$r"; break; fi; done
    if [ -z "$gb_rd" ]; then gb_fail "no amd64/bsd.rd on this OpenBSD ISO"; return; fi
    kopenbsd $gb_rd
}

# NetBSD: GRUB's knetbsd hangs with NetBSD 9+ amd64 kernels (tested with 11.1), so say so plainly
function gb_netbsd {
    gb_fail "NetBSD's kernel doesn't start from GRUB (tested with NetBSD 11.1). Write this ISO to its own USB for now."
}

function gb_boot {
    set iso_path="$1"
    export iso_path
    set gb_extra="$2"
    set gb_k=""; set gb_i=""; set gb_rd=""
    if ! loopback loop ($gbdata)$iso_path; then gb_fail "GRUB couldn't open it"; return; fi

    # OpenBSD keeps its install kernel in VERSION/amd64/bsd.rd
    set gb_obsd=""
    for r in (loop)/*/amd64/bsd.rd; do if [ -f "$r" ]; then set gb_obsd=1; break; fi; done

    if [ -f (loop)/boot/grub/grub_void.cfg -o -f (loop)/boot/initrd -a -f (loop)/LiveOS/squashfs.img ]; then
        gb_dracut_void
    elif [ -f (loop)/boot/grub/loopback.cfg ]; then
        gb_msg "using the ISO's own loopback menu (loopback.cfg)"
        set root=(loop)
        configfile (loop)/boot/grub/loopback.cfg
    elif [ -d (loop)/casper ]; then
        gb_casper
    elif [ -d (loop)/live ]; then
        gb_debian_live
    elif [ -f (loop)/images/pxeboot/vmlinuz ]; then
        gb_dracut_fedora
    elif [ -f (loop)/boot/kernel/kernel ]; then
        gb_freebsd
    elif [ -n "$gb_obsd" -o -f (loop)/bsd.rd ]; then
        gb_openbsd
    elif [ -f (loop)/netbsd -o -f (loop)/netbsd.gz -o -d (loop)/amd64/binary ]; then
        gb_netbsd
    else
        set gb_found=""
        for d in (loop)/*/boot/x86_64/vmlinuz-*; do if [ -f "$d" ]; then set gb_found=1; break; fi; done
        if [ -n "$gb_found" ]; then
            gb_archiso
        elif [ -f (loop)/sources/install.wim -o -f (loop)/sources/install.esd ]; then
            gb_fail "Windows installers aren't supported yet"
        else
            gb_fail "Grim Boot doesn't recognise this kind of ISO"
        fi
    fi
}

# ---------------------------------------------------------------- the menu: every ISO found
function gb_add {
    regexp --set=1:gb_path '^\([^)]*\)(.*)$' "$1"
    regexp --set=1:gb_name '([^/]+)$' "$1"
    menuentry "$gb_name" "$gb_path" --class iso {
        gb_boot "$2" ""
    }
}

function gb_scan {
    for f in ($gbdata)/$1*.iso ($gbdata)/$1*.ISO; do
        if [ -f "$f" ]; then gb_add "$f"; set gb_count=1; fi
    done
}

set gb_count=""
if [ -n "$gbdata" ]; then
    gb_scan ""
    gb_scan "isos/"
    for sub in ($gbdata)/isos/*; do
        if [ -d "$sub" ]; then
            regexp --set=1:gb_sub '^\([^)]*\)/(.*)$' "$sub"
            gb_scan "$gb_sub/"
        fi
    done
fi

if [ -z "$gb_count" ]; then
    menuentry "No ISO files yet: copy some onto the GRIMBOOT partition" { sleep 1; }
fi

submenu "Grim Boot $grimboot_version ($gbplatform) · more" --class tools {
    menuentry "Boot the first hard disk" --class disk {
        if [ "${grub_platform}" == "efi" ]; then
            for e in (hd1,gpt1)/EFI/BOOT/BOOTX64.EFI (hd1,msdos1)/EFI/BOOT/BOOTX64.EFI; do
                if [ -f "$e" ]; then chainloader "$e"; boot; fi
            done
            echo "No bootable EFI system found on the first disk."; sleep 5
        else
            set root=(hd1); chainloader +1
        fi
    }
    if [ "${grub_platform}" == "efi" ]; then
        menuentry "UEFI firmware settings" --class settings { fwsetup }
    fi
    menuentry "Restart" --class restart { reboot }
    menuentry "Power off" --class shutdown { halt }
}
