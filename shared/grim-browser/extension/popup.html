<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="grim.css">
<style>
  body { width: 320px; padding: 14px; }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .top img { width: 32px; height: 32px; }
  .top b { font-size: 17px; }
  .big { font-size: 34px; font-weight: 800; color: var(--red2); line-height: 1; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row button { flex: 1; }
  #tor { font-size: 13px; }
</style></head>
<body>
  <div class="top"><img src="icons/32.png" alt=""><b>Grim Shield</b></div>
  <div class="big" id="count">0</div>
  <div class="dim">ads and trackers blocked on this page</div>
  <div class="switch"><div><div class="what" id="site">this site</div><div class="why">blocking on this site</div></div><input type="checkbox" id="here"></div>
  <div class="switch"><div><div class="what">Private windows through Tor</div><div class="why" id="tor">checking Tor…</div></div><input type="checkbox" id="torOn"></div>
  <div class="row"><button class="red" id="burn">🔥 Burn everything</button></div>
  <div class="row"><button id="newid">New Tor identity</button><button id="settings">Settings</button></div>
  <script src="popup.js"></script>
</body></html>
