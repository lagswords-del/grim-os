LABEL arch
TEXT HELP
Boot the Grim OS on BIOS.
It allows you to install Grim OS or perform system maintenance.
ENDTEXT
MENU LABEL Grim OS (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS%

# Low-RAM boot option
LABEL archlowram
TEXT HELP
Boot Grim OS to a text console with nothing else running.
No desktop, no network: the least RAM possible.
ENDTEXT
MENU LABEL Grim OS (%ARCH%, BIOS) - Low RAM, no desktop
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% %KERNEL_PARAMS% systemd.unit=grim-lowram.target

# Accessibility boot option
LABEL archspeech
TEXT HELP
Boot the Grim OS on BIOS with speakup screen reader.
It allows you to install Grim OS or perform system maintenance with speech feedback.
ENDTEXT
MENU LABEL Grim OS (%ARCH%, BIOS) with ^speech
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% accessibility=on %KERNEL_PARAMS%
