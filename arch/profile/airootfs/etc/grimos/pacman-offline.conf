# Used by griminstall in offline mode: installs only from the repository on the ISO.
# The packages were checked against Arch's signing keys when the ISO was built,
# and the ISO itself is read-only, so signature checks are skipped here.
[options]
Architecture = auto
CacheDir = /tmp/grimos-pkgcache/
SigLevel = Never
LocalFileSigLevel = Never

[grimos]
Server = file:///opt/grimos/repo
