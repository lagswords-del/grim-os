<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Void-style broken ring, in black -->
  <defs>
    <mask id="cut">
      <rect width="512" height="512" fill="#fff"/>
      <!-- diagonal gaps through the ring, like the Void mark -->
      <rect x="-40" y="236" width="592" height="40" fill="#000" transform="rotate(-45 256 256)"/>
    </mask>
  </defs>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#0a0a0a" stroke-width="56" mask="url(#cut)"/>
  <!-- mini reaper -->
  <g fill="#0a0a0a">
    <!-- hood + cloak -->
    <path d="M256 120
             C 214 120 192 156 192 196
             C 192 226 186 250 176 276
             C 164 306 150 336 138 372
             L 374 372
             C 362 336 348 306 336 276
             C 326 250 320 226 320 196
             C 320 156 298 120 256 120 Z"/>
  </g>
  <!-- face void -->
  <ellipse cx="256" cy="200" rx="34" ry="42" fill="#ffffff"/>
  <ellipse cx="256" cy="208" rx="24" ry="32" fill="#0a0a0a"/>
  <!-- glowing eyes -->
  <circle cx="246" cy="204" r="5" fill="#ffffff"/>
  <circle cx="266" cy="204" r="5" fill="#ffffff"/>
  <!-- scythe -->
  <g stroke="#0a0a0a" stroke-linecap="round" fill="none">
    <line x1="352" y1="378" x2="334" y2="150" stroke-width="11"/>
  </g>
  <path d="M334 150 C 372 136 404 158 412 204 C 390 180 362 170 336 176 Z" fill="#0a0a0a"/>
</svg>
