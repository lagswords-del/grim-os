general { colors = true color_good = "#e8e8e8" color_bad = "#c1121f" interval = 10 }
order += "wireless _first_"
order += "memory"
order += "battery all"
order += "tztime local"
wireless _first_ { format_up = "%essid" format_down = "offline" }
memory { format = "RAM %used" }
battery all { format = "bat %percentage" }
tztime local { format = "%a %d %b  %H:%M" }
